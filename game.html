<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24x24 踩地雷 · 99 顆地雷</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: #2d3a3f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 16px;
        }
        .container {
            background: #3d4e55;
            padding: 24px 28px 32px;
            border-radius: 40px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.6), 0 0 0 2px #5b737b inset;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: #eaf0f2;
            font-weight: 600;
            font-size: 1.3rem;
            padding: 0 6px;
        }
        .header .mine-count {
            background: #1e2a30;
            padding: 6px 20px;
            border-radius: 40px;
            box-shadow: inset 0 2px 4px #0f171c;
            letter-spacing: 1px;
        }
        .btn {
            background: #dce6ec;
            border: none;
            padding: 8px 24px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1d2c33;
            box-shadow: 0 5px 0 #8fa3ad;
            cursor: pointer;
            transition: 0.07s linear;
        }
        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #7e929c;
        }
        .grid-wrapper {
            background: #28353b;
            padding: 10px;
            border-radius: 28px;
            box-shadow: inset 0 4px 8px #141e23;
        }
        #mine-grid {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            gap: 2px;
            width: min(92vw, 92vh, 700px);
            height: min(92vw, 92vh, 700px);
            margin: 0 auto;
        }
        .cell {
            background: #b3c9d4;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.8rem, 1.6vw, 1.3rem);
            font-weight: 800;
            cursor: pointer;
            transition: 0.05s;
            box-shadow: 0 2px 0 #7f96a1;
            aspect-ratio: 1 / 1;
            color: #1a2a33;
        }
        .cell.revealed {
            background: #dde9f0;
            box-shadow: inset 0 0 0 1px #b2c9d4;
            color: #0b1a24;
        }
        .cell.flagged {
            background: #f5d7b0;
            box-shadow: 0 2px 0 #b3926e;
        }
        .cell.mine-exploded {
            background: #ff5a5a !important;
            box-shadow: 0 0 0 2px #cc0000;
        }
        .cell.mine-shown {
            background: #d9b3b3;
        }
        .cell:active:not(.revealed):not(.flagged) {
            transform: scale(0.92);
        }
        .status {
            margin-top: 18px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #eef6f8;
            background: #1f2d34;
            padding: 12px 18px;
            border-radius: 60px;
            box-shadow: inset 0 3px 6px #0e171d;
            min-height: 3.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .status span {
            background: #2d4049;
            padding: 4px 18px;
            border-radius: 40px;
        }
        @media (max-width: 600px) {
            .container { padding: 12px; }
            .header { font-size: 1rem; flex-wrap: wrap; gap: 8px; }
            .btn { padding: 6px 14px; font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="mine-count">💣 <span id="mineCounter">99</span></div>
        <button class="btn" id="resetBtn">🔄 新遊戲</button>
    </div>
    <div class="grid-wrapper">
        <div id="mine-grid"></div>
    </div>
    <div class="status" id="statusMessage">
        <span>🖱 左鍵揭開 · 右鍵標記旗子</span>
    </div>
</div>
<script>
    (function(){
        const ROWS = 24;
        const COLS = 24;
        const TOTAL_MINES = 99;

        // 遊戲狀態
        let board = [];            // 每個格子的地雷資訊 (true/false)
        let revealed = [];         // 是否已揭開
        let flagged = [];          // 是否標記旗子
        let gameOver = false;
        let firstClick = true;     // 第一次點擊保證不踩雷
        let remainingMines = TOTAL_MINES;

        const gridEl = document.getElementById('mine-grid');
        const statusEl = document.getElementById('statusMessage');
        const mineCounterEl = document.getElementById('mineCounter');

        // ---------- 初始化 (隨機放雷) ----------
        function initBoard(avoidRow, avoidCol) {
            // 先清空
            board = Array(ROWS).fill().map(() => Array(COLS).fill(false));
            revealed = Array(ROWS).fill().map(() => Array(COLS).fill(false));
            flagged = Array(ROWS).fill().map(() => Array(COLS).fill(false));
            gameOver = false;
            firstClick = false;

            // 隨機放置地雷 (避開第一次點擊的位置)
            let minesPlaced = 0;
            const maxAttempts = 5000;
            let attempts = 0;
            while (minesPlaced < TOTAL_MINES && attempts < maxAttempts) {
                attempts++;
                const r = Math.floor(Math.random() * ROWS);
                const c = Math.floor(Math.random() * COLS);
                // 避開第一次點擊的格子及其周圍 3x3 (讓玩家不會一開始就爆)
                if (avoidRow !== undefined && avoidCol !== undefined) {
                    const dr = Math.abs(r - avoidRow);
                    const dc = Math.abs(c - avoidCol);
                    if (dr <= 1 && dc <= 1) continue;
                }
                if (!board[r][c]) {
                    board[r][c] = true;
                    minesPlaced++;
                }
            }
            // 萬一放不滿 (極罕見) 補滿
            while (minesPlaced < TOTAL_MINES) {
                for (let r = 0; r < ROWS && minesPlaced < TOTAL_MINES; r++) {
                    for (let c = 0; c < COLS && minesPlaced < TOTAL_MINES; c++) {
                        if (!board[r][c]) {
                            board[r][c] = true;
                            minesPlaced++;
                        }
                    }
                }
            }
            remainingMines = TOTAL_MINES;
            updateMineCounter();
        }

        // ---------- 計算周圍地雷數 ----------
        function countAdjacentMines(row, col) {
            let count = 0;
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = row + dr, nc = col + dc;
                    if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc]) {
                        count++;
                    }
                }
            }
            return count;
        }

        // ---------- 展開空白區域 (BFS) ----------
        function expandEmpty(row, col) {
            const queue = [[row, col]];
            const visited = new Set();
            visited.add(`${row},${col}`);
            while (queue.length > 0) {
                const [r, c] = queue.shift();
                const adjMines = countAdjacentMines(r, c);
                if (adjMines > 0) {
                    // 只揭開這一格，不繼續擴散
                    revealed[r][c] = true;
                    continue;
                }
                // 周圍沒有地雷 -> 揭開並擴散
                revealed[r][c] = true;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr, nc = c + dc;
                        if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
                        const key = `${nr},${nc}`;
                        if (!visited.has(key) && !revealed[nr][nc] && !board[nr][nc]) {
                            visited.add(key);
                            queue.push([nr, nc]);
                        }
                    }
                }
            }
            // 確保所有訪問過的格子都被揭開 (有些可能被 queue 但未被揭開)
            for (const key of visited) {
                const [r, c] = key.split(',').map(Number);
                if (!revealed[r][c]) {
                    revealed[r][c] = true;
                }
            }
        }

        // ---------- 揭開一個格子 ----------
        function revealCell(row, col) {
            if (gameOver) return false;
            if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
            if (revealed[row][col]) return false;
            if (flagged[row][col]) return false; // 有旗子保護

            // 第一次點擊：重新生成盤面 (避開此格)
            if (firstClick) {
                initBoard(row, col);
                // 重新生成後，如果此格是地雷 (理論上不會) 但還是保護
                if (board[row][col]) {
                    // 極端情況，強制把這格變成安全
                    board[row][col] = false;
                    // 補一顆雷到別處
                    for (let r = 0; r < ROWS; r++) {
                        for (let c = 0; c < COLS; c++) {
                            if (!board[r][c] && !(r === row && c === col)) {
                                board[r][c] = true;
                                break;
                            }
                        }
                    }
                }
                firstClick = false;
            }

            // 踩到地雷 -> game over
            if (board[row][col]) {
                revealed[row][col] = true;
                gameOver = true;
                renderBoard(true);
                statusEl.innerHTML = `<span>💥 踩到地雷！遊戲結束</span>`;
                return false;
            }

            // 安全格子
            const adjMines = countAdjacentMines(row, col);
            if (adjMines > 0) {
                revealed[row][col] = true;
            } else {
                // 0 地雷 -> 展開
                expandEmpty(row, col);
            }

            renderBoard(false);
            // 檢查勝利
            if (checkWin()) {
                statusEl.innerHTML = `<span>🎉 恭喜！你贏了！ 🎉</span>`;
                gameOver = true;
                renderBoard(false);
            } else {
                statusEl.innerHTML = `<span>✅ 繼續 · 剩餘 ${remainingMines} 顆地雷</span>`;
            }
            return true;
        }

        // ---------- 標記 / 取消旗子 ----------
        function toggleFlag(row, col) {
            if (gameOver) return;
            if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
            if (revealed[row][col]) return;

            if (flagged[row][col]) {
                flagged[row][col] = false;
                remainingMines++;
            } else {
                flagged[row][col] = true;
                remainingMines--;
            }
            updateMineCounter();
            renderBoard(false);
        }

        // ---------- 檢查勝利 (所有非地雷格子都揭開) ----------
        function checkWin() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (!board[r][c] && !revealed[r][c]) {
                        return false;
                    }
                }
            }
            return true;
        }

        // ---------- 更新計數器 ----------
        function updateMineCounter() {
            mineCounterEl.textContent = Math.max(0, remainingMines);
        }

        // ---------- 渲染 ----------
        function renderBoard(exploded = false) {
            gridEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const isRevealed = revealed[r][c];
                    const isFlagged = flagged[r][c];
                    const isMine = board[r][c];

                    if (isRevealed) {
                        cell.classList.add('revealed');
                        if (isMine) {
                            cell.textContent = '💣';
                            if (exploded && r === explodedRow && c === explodedCol) {
                                cell.classList.add('mine-exploded');
                            } else {
                                cell.classList.add('mine-shown');
                            }
                        } else {
                            const cnt = countAdjacentMines(r, c);
                            if (cnt > 0) {
                                cell.textContent = cnt;
                                // 顏色
                                const colors = ['', '#1a4d8a', '#2a7a3a', '#c42f2f', '#1f1f8a', '#7a2f2f', '#2f7a7a', '#2f2f2f', '#4a4a4a'];
                                cell.style.color = colors[cnt] || '#1a2a33';
                            }
                        }
                    } else if (isFlagged) {
                        cell.classList.add('flagged');
                        cell.textContent = '🚩';
                    } else {
                        // 未揭開
                        cell.textContent = '';
                    }

                    // 事件
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    // 左鍵
                    cell.addEventListener('click', (e) => {
                        const row = parseInt(e.currentTarget.dataset.row);
                        const col = parseInt(e.currentTarget.dataset.col);
                        revealCell(row, col);
                    });

                    // 右鍵 (標記旗子)
                    cell.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        const row = parseInt(e.currentTarget.dataset.row);
                        const col = parseInt(e.currentTarget.dataset.col);
                        toggleFlag(row, col);
                    });

                    gridEl.appendChild(cell);
                }
            }
            // 如果爆炸了，額外儲存爆炸位置
            if (exploded) {
                // 不特別處理
            }
        }

        let explodedRow = -1, explodedCol = -1;

        // 覆寫 revealCell 來記錄爆炸位置
        const originalReveal = revealCell;
        revealCell = function(row, col) {
            if (gameOver) return false;
            if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return false;
            if (revealed[row][col]) return false;
            if (flagged[row][col]) return false;

            if (firstClick) {
                initBoard(row, col);
                if (board[row][col]) {
                    board[row][col] = false;
                    for (let r = 0; r < ROWS; r++) {
                        for (let c = 0; c < COLS; c++) {
                            if (!board[r][c] && !(r === row && c === col)) {
                                board[r][c] = true;
                                break;
                            }
                        }
                    }
                }
                firstClick = false;
            }

            if (board[row][col]) {
                revealed[row][col] = true;
                gameOver = true;
                explodedRow = row;
                explodedCol = col;
                renderBoard(true);
                statusEl.innerHTML = `<span>💥 踩到地雷！遊戲結束</span>`;
                return false;
            }

            const adjMines = countAdjacentMines(row, col);
            if (adjMines > 0) {
                revealed[row][col] = true;
            } else {
                expandEmpty(row, col);
            }

            renderBoard(false);
            if (checkWin()) {
                statusEl.innerHTML = `<span>🎉 恭喜！你贏了！ 🎉</span>`;
                gameOver = true;
                renderBoard(false);
            } else {
                statusEl.innerHTML = `<span>✅ 繼續 · 剩餘 ${remainingMines} 顆地雷</span>`;
            }
            return true;
        };

        // ---------- 新遊戲 ----------
        function newGame() {
            firstClick = true;
            gameOver = false;
            explodedRow = -1;
            explodedCol = -1;
            remainingMines = TOTAL_MINES;
            // 初始化空白盤面 (先不放置地雷，等第一次點擊)
            board = Array(ROWS).fill().map(() => Array(COLS).fill(false));
            revealed = Array(ROWS).fill().map(() => Array(COLS).fill(false));
            flagged = Array(ROWS).fill().map(() => Array(COLS).fill(false));
            // 預先隨機放雷 (但 firstClick 會重新生成)
            initBoard(-1, -1);
            firstClick = true;  // 確保第一次點擊觸發重新佈雷
            updateMineCounter();
            renderBoard(false);
            statusEl.innerHTML = `<span>🆕 新遊戲 · 點擊任何格子開始</span>`;
        }

        // 重置按鈕
        document.getElementById('resetBtn').addEventListener('click', newGame);

        // ---------- 啟動 ----------
        newGame();
    })();
</script>
</body>
</html>
